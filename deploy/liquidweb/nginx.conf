# Nginx reverse proxy for Liquid Web VPS
# Install:
#   sudo cp deploy/liquidweb/nginx.conf /etc/nginx/sites-available/kdcuganda.org
#   sudo ln -sf /etc/nginx/sites-available/kdcuganda.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: use certbot after DNS points to this server
#   sudo certbot --nginx -d kdcuganda.org -d www.kdcuganda.org

upstream kdc_next {
    server 127.0.0.1:3005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name kdcuganda.org www.kdcuganda.org;

    # Uncomment after certbot:
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;

    location / {
        proxy_pass http://kdc_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://kdc_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

