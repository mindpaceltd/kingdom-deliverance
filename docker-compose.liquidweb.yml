# Production stack for Liquid Web VPS
# Usage:
#   cp .env.liquidweb.example .env.production
#   docker compose -f docker-compose.liquidweb.yml --env-file .env.production up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kdcuganda.org}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_R2_PUBLIC_URL: ${NEXT_PUBLIC_R2_PUBLIC_URL:-}
    image: kdc-web:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3005
      HOSTNAME: 0.0.0.0
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      # Bind to localhost only — Nginx on the host terminates TLS
      - "127.0.0.1:3005:3005"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3005/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    image: node:20-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENABLE_QUEUE_PROCESSOR: ${ENABLE_QUEUE_PROCESSOR:-false}
    volumes:
      - ./:/app
      - worker_node_modules:/app/node_modules
    command: >
      sh -c "npm ci --omit=dev &&
             if [ \"$$ENABLE_QUEUE_PROCESSOR\" = \"true\" ]; then npm run worker; else echo 'Worker idle (ENABLE_QUEUE_PROCESSOR!=true)'; sleep infinity; fi"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - workers

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do not expose Redis publicly on Liquid Web
    ports: []

volumes:
  redis-data:
  worker_node_modules:
